<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云璟江屿 · 客餐厅样板间 · 光照烘焙版</title>
<style>
:root{--ink:#1d1d1f;--accent:#c8613f;--panel:rgba(255,255,255,.86);--line:rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0e0f10;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;color:var(--ink)}
#app{position:fixed;inset:0}
canvas{display:block}
.card{position:fixed;background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);
 border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:10}
#brand{top:16px;left:16px;padding:12px 16px;max-width:300px}
#brand .k{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:600}
#brand h1{font-size:17px;font-weight:650;margin:3px 0 2px}
#brand p{font-size:11.5px;color:#5d5d60;line-height:1.45}
#toolbar{top:16px;right:16px;display:flex;gap:6px;padding:6px}
button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);
 border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:#bbb}
button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
#hint{bottom:16px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:12px;color:#4b4b4e}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f2efea;z-index:30;
 flex-direction:column;gap:14px;transition:opacity .5s}
#loader .bar{width:180px;height:3px;background:#ddd;border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:2px;animation:m 1.1s infinite}
@keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
#loader .t{font-size:13px;color:#6e6a63}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader"><div class="bar"><i></i></div><div class="t">正在载入烘焙光照场景…</div></div>
<div id="brand" class="card">
 <div class="k">YUNJING JIANGYU · LIVING PILOT</div>
 <h1>客餐厅 · 大横厅</h1>
 <p>Blender 程序化建模 · Three.js 实时 PBR · 35.1㎡ · 南向后阳台</p>
</div>
<div id="toolbar" class="card">
 <button id="b-day" class="on">日间</button>
 <button id="b-night">夜晚</button>
 <button id="b-orbit" class="on">环绕</button>
 <button id="b-walk">漫游</button>
 <button id="b-shot">出图</button>
</div>
<div id="hint" class="card">拖拽旋转 · 滚轮缩放 · 双击地面前往（漫游模式 WASD 移动）</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
 integrity="sha384-vV17nr/rMaJqmeZkFUzXLpHdQ+ME5QHKdydaqqN+3Ga39RJlNrTatJxHwGV4ml2C" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>

<script src="assets.js"></script>
<script src="lights.js"></script>
<script src="materials.js"></script>
<script src="pilot-viewer.js"></script>
</body>
</html>
